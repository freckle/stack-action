name: Release

on:
  push:
    branches:
      - main
      - rc/*
  workflow_dispatch:

# GITHUB_TOKEN is only used by actions/checkout here: semantic-release makes all
# of its writes (tags, releases, commits) with the automation App token below.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FRECKLE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.FRECKLE_AUTOMATION_PRIVATE_KEY }}

      - id: release
        uses: cycjimmy/semantic-release-action@v6.0.0
        # conventional-changelog-conventionalcommits is held at 9.x: v10 needs
        # conventional-changelog-writer@9, which semantic-release@25 does not ship.
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
            @semantic-release/exec
            semantic-release-major-tag
        env:
          FORCE_COLOR: 1
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
